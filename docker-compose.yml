services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the project .env}
      MYSQL_DATABASE: ${DB_NAME:-Procument}
      MYSQL_USER: ${DB_USER:?Set DB_USER in the project .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the project .env}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - procument_mysql_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  procument_mysql_data:
