services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the project .env}
      MYSQL_DATABASE: ${DB_NAME:-Procument}
      MYSQL_USER: ${DB_USER:?Set DB_USER in the project .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the project .env}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - procument_mysql_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:?Set DB_USER in the project .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the project .env}
      DB_NAME: ${DB_NAME:-Procument}
    ports:
      - "4000:4000"
    volumes:
      - ./backend/.env:/app/.env:ro
      - profile_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    init: true
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_URL: http://localhost:4000/api
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5173',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

volumes:
  procument_mysql_data:
  profile_uploads:
